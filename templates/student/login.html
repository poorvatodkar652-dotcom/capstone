{% extends "base.html" %}
{% block title %}Student Login — Smart Hostel Management{% endblock %}

{% block nav %}
<div class="nav-links">
    <a href="{{ url_for('home.index') }}">🏠 Home</a>
</div>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div class="card-title">🎓 Student Login</div>
    <form method="POST" id="studentLoginForm">
        <div class="form-group">
            <label>Enrollment Number <span class="required">*</span></label>
            <input type="text" name="enrollment" class="form-control" placeholder="Enter enrollment number" required>
        </div>
        <div class="form-group">
            <label>Password <span class="required">*</span></label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Branch <span class="required">*</span></label>
                <select name="branch" class="form-control" required>
                    <option value="">Select Branch</option>
                    {% for b in branches %}
                    <option value="{{ b }}">{{ b }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Year <span class="required">*</span></label>
                <select name="year" class="form-control" required>
                    <option value="">Select Year</option>
                    {% for y in years %}
                    <option value="{{ y }}">{{ y }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">LOGIN</button>
    </form>
</div>
{% endblock %}
