{% extends "base.html" %}
{% block title %}Student Login — Smart Hostel Management{% endblock %}

{% block nav %}
<div class="flex space-x-4">
    <a href="{{ url_for('home.index') }}"
        class="text-white hover:text-yellow-300 font-medium transition-colors border border-transparent hover:border-yellow-300 px-3 py-1 rounded-md"><svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Home</a>
</div>
{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-lg border border-gray-100 p-8 max-w-md mx-auto mt-8">
    <div class="text-2xl font-bold text-center text-blue-900 mb-8 pb-4 border-b"><svg class="w-10 h-10 inline-block text-blue-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 14l9-5-9-5-9 5 9 5z"></path><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path></svg> Student Login</div>
    <form method="POST" id="studentLoginForm" class="space-y-6">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Enrollment Number <span
                    class="text-red-500">*</span></label>
            <input type="text" name="enrollment"
                class="w-full border border-gray-300 rounded-md px-4 py-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                placeholder="Enter enrollment number" required>
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Password <span
                    class="text-red-500">*</span></label>
            <input type="password" name="password"
                class="w-full border border-gray-300 rounded-md px-4 py-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                placeholder="Enter password" required>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Branch <span
                        class="text-red-500">*</span></label>
                <select name="branch"
                    class="w-full border border-gray-300 rounded-md px-4 py-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition appearance-none"
                    required>
                    <option value="">Select Branch</option>
                    {% for b in branches %}
                    <option value="{{ b }}">{{ b }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Year <span
                        class="text-red-500">*</span></label>
                <select name="year"
                    class="w-full border border-gray-300 rounded-md px-4 py-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition appearance-none"
                    required>
                    <option value="">Select Year</option>
                    {% for y in years %}
                    <option value="{{ y }}">{{ y }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="submit"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-base font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors mt-4">
            LOGIN
        </button>
    </form>
</div>
{% endblock %}
