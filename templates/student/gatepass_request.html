{% extends "base.html" %}
{% block title %}Gatepass Request — Smart Hostel Management{% endblock %}

{% block nav %}
<div class="nav-links">
    <a href="{{ url_for('student.dashboard') }}"><svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg> Dashboard</a>
    <a href="{{ url_for('student.logout') }}"><svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> Logout</a>
</div>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-title"><svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg> Gatepass Request</div>
    <form method="POST" id="gatepassForm">
        <div class="form-group">
            <label>Reason <span class="required">*</span></label>
            <textarea name="reason" class="form-control" placeholder="Enter reason for gatepass" required></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Out Date &amp; Time <span class="required">*</span></label>
                <input type="datetime-local" name="out_date" class="form-control" required>
                <div class="form-hint">Use the calendar &amp; time picker.</div>
            </div>
            <div class="form-group">
                <label>In Date &amp; Time <span class="required">*</span></label>
                <input type="datetime-local" name="in_date" class="form-control" required>
                <div class="form-hint">Use the calendar &amp; time picker.</div>
            </div>
        </div>
        <div class="form-group">
            <label>Place / Destination <span class="required">*</span></label>
            <input type="text" name="place" class="form-control" placeholder="Where are you going?" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Submit Request</button>
    </form>
</div>
{% endblock %}
